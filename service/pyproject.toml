[project]
name = "tana-helper"
version = "0.2.1"
description = "Small helper service for Tana to add various extensions via MakeAPI calls"
authors = [
    {name = "verveguy", email = "bpjadam@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "uvicorn>=0.32.0",
    "openai>=1.60.0",
    "fastapi>=0.116.0",
    "pytz>=2025.2",
    "Jinja2>=3.1.6",
    "python-dotenv>=1.1.0",
    "httpx>=0.28.0",
    "rich>=14.0.0",
    "snowflake-id>=1.0.2",
    "aiofiles>=24.1.0",
    "ratelimit>=2.2.1",
    "chromadb>=1.0.15",
    "weaviate-client>=4.16.0",
    "pydantic-settings>=2.10.0",
    "pyqt6>=6.9.0",
    "llama-index>=0.10.68",
    "pinecone-client>=6.0.0",
    "ollama>=0.5.0",
    "mkdocs-material>=9.6.15",
]

[project.scripts]
# Development server with hot reloading
dev = "service.cli:dev"
# Production server
serve = "service.cli:serve" 
# Development server with debug logging
debug = "service.cli:debug"

[project.optional-dependencies]
dev = [
    "pyinstaller==6.2.0", # keep this old deliberately to avoid virus false positives
    "pytest>=8.4.0",
    "python-dotenv>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["service"]

[tool.uv]
dev-dependencies = [
    "pyinstaller==6.2.0",
    "pytest>=8.4.0",
    "python-dotenv>=1.1.0",
    "ruff>=0.12.4",
]

[tool.ruff]
# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.11+
target-version = "py311"

# Enable specific linting rules
[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
