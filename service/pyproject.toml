[project]
name = "tana-helper"
version = "0.2.1"
description = "Small helper service for Tana to add various extensions via MakeAPI calls"
authors = [
    {name = "verveguy", email = "bpjadam@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "uvicorn>=0.32.0",
    "openai>=1.60.0",
    "fastapi>=0.116.0",
    "pytz>=2025.2",
    "Jinja2>=3.1.6",
    "python-dotenv>=1.1.0",
    "httpx>=0.28.0",
    "rich>=14.0.0",
    "snowflake-id>=1.0.2",
    "aiofiles>=24.1.0",
    "ratelimit>=2.2.1",
    "chromadb>=1.0.15",
    "weaviate-client>=4.16.0",
    "pydantic-settings>=2.10.0",
    "pyqt6>=6.9.0",
    "llama-index>=0.10.68",
    "pinecone-client>=6.0.0",
    "ollama>=0.5.0",
    "mkdocs-material>=9.6.15",
]

[project.optional-dependencies]
dev = [
    "pyinstaller==6.2.0", # keep this old deliberately to avoid virus false positives
    "pytest>=8.4.0",
    "python-dotenv>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["service"]

[tool.uv]
dev-dependencies = [
    "pyinstaller==6.2.0",
    "pytest>=8.4.0",
    "python-dotenv>=1.1.0",
]
